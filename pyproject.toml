[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "conus_carbon"
version = "0.1.0"
description = "Python port of the CONUS stream-CO2 reactive-transport model (Saccardi et al. 2024)"
readme = "README_python.md"
requires-python = ">=3.10"
authors = [{ name = "Kwan-Hyuck Kim" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
notebook = ["matplotlib>=3.7", "jupyter>=1.0"]
dev = ["pytest>=7.0"]
# geodata reader for the real setup_hydrography (when NAS data is mounted)
geo = ["pyogrio>=0.7", "geopandas>=0.14"]

[tool.hatch.build.targets.wheel]
packages = ["conus_carbon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
